<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#123b3a" />
		<title>Week 7 Mini App | User Directory</title>
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="/css/styles.css" />
	</head>
	<body>
		<nav class="navbar navbar-dark app-navbar">
			<div class="container app-container">
				<a class="navbar-brand" href="/">
					<span>IT112 <span class="brand-divider">/</span> Week 7</span>
				</a>
				<span class="nav-caption">FULL-STACK LAB</span>
			</div>
		</nav>

		<main class="container app-container py-5">
			<header class="page-heading">
				<div>
					<p class="eyebrow">DATABASE WORKSPACE</p>
					<h1>User directory</h1>
					<p class="heading-copy">Create and manage your MongoDB records.</p>
				</div>
				<div class="record-count" aria-live="polite">
					<span class="count-dot" aria-hidden="true"></span>
					<span id="userCount">Loading users</span>
				</div>
			</header>

			<div id="msg" class="message-region" aria-live="polite"></div>

			<div class="row g-4 align-items-start">
				<section class="col-lg-5" aria-labelledby="formTitle">
					<div class="workspace-panel form-panel">
						<div class="panel-heading">
							<div class="panel-icon" aria-hidden="true">+</div>
							<div>
								<p class="eyebrow mb-1">NEW RECORD</p>
								<h2 id="formTitle">Add a user</h2>
							</div>
						</div>
						<form id="userForm">
							<div class="mb-3">
								<label class="form-label" for="name">Name</label>
								<input
									class="form-control"
									id="name"
									name="name"
									autocomplete="name"
									placeholder="e.g. Juan Dela Cruz"
									required
								/>
							</div>
							<div class="mb-3">
								<label class="form-label" for="email">Email</label>
								<input
									class="form-control"
									id="email"
									name="email"
									type="email"
									autocomplete="email"
									placeholder="juan@example.com"
									required
								/>
							</div>
							<div class="mb-4">
								<label class="form-label" for="age">Age <span class="optional-label">OPTIONAL</span></label>
								<input
									class="form-control"
									id="age"
									name="age"
									type="number"
									min="1"
									placeholder="Leave blank if unknown"
								/>
							</div>
							<button class="btn btn-save w-100" id="saveButton" type="submit">
								<span>Save user</span>
								<span aria-hidden="true">&#8594;</span>
							</button>
						</form>
					</div>
				</section>

				<section class="col-lg-7" aria-labelledby="listTitle">
					<div class="workspace-panel list-panel">
						<div class="list-heading">
							<div>
								<p class="eyebrow mb-1">YOUR DATABASE</p>
								<h2 id="listTitle">User list</h2>
							</div>
							<button class="btn btn-refresh" id="refreshButton" type="button" aria-label="Refresh user list" title="Refresh list">
								<span aria-hidden="true">&#8635;</span>
							</button>
						</div>
						<div id="userList" class="user-list" aria-live="polite">
							<p class="list-state">Loading users...</p>
						</div>
					</div>
				</section>
			</div>
			<footer class="page-footer">IT112 <span aria-hidden="true">&middot;</span> Express + MongoDB</footer>
		</main>

		<script src="/js/app.js" defer></script>
	</body>
</html>
